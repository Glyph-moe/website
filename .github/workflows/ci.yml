name: CI

on:
  push:
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` also runs the `prepare` script, which installs the Husky hook.
      - run: npm ci

      - name: Type and template check
        run: npm run check

      - name: Build the site
        run: npm run build
